syntax = "proto3";

package csar.credential.v1;

option go_package = "github.com/ledatu/csar-proto/csar/credential/v1;credentialv1";

// CredentialService accepts reports from trusted routers over the coordinator's
// existing authenticated transport. End-user headers are never reports.
service CredentialService {
  // ReportRejection quarantines only the exact injected stored version.
  // It does not replay a request or mint a replacement credential.
  rpc ReportRejection(ReportRejectionRequest) returns (ReportRejectionResponse);
}

message ReportRejectionRequest {
  string token_ref = 1;
  string version = 2;
  // SHA-256 of the injected value, never the credential itself. Allows a legacy
  // encrypted object to stay rejected after re-encryption of the same value.
  string credential_fingerprint = 3;
}

message ReportRejectionResponse {}
