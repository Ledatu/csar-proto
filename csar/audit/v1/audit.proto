syntax = "proto3";

package csar.audit.v1;

option go_package = "github.com/ledatu/csar-proto/csar/audit/v1;auditv1";

import "google/protobuf/timestamp.proto";

// AuditIngestService accepts audit events for centralized persistence.
service AuditIngestService {
  rpc RecordEvent(RecordEventRequest) returns (RecordEventResponse);
  rpc RecordEvents(RecordEventsRequest) returns (RecordEventsResponse);
}

message AuditEvent {
  string service = 1;
  string actor = 2;
  string action = 3;
  string target_type = 4;
  string target_id = 5;
  string scope_type = 6;
  string scope_id = 7;
  bytes before_state = 8;
  bytes after_state = 9;
  bytes metadata = 10;
  string request_id = 11;
  string client_ip = 12;
  google.protobuf.Timestamp timestamp = 13;
  // Stable UUID identifying one logical emission; retain it across retries.
  // Omitted by legacy producers; new ingest assigns it before enqueueing.
  string id = 14;
  // Optional issuer-confirmed principal of the immediate authenticated hop.
  // Absent on historical events; actor retains its original meaning.
  CallerIdentity caller = 15;
  // Original principal carried by verified delegation, separate from the hop.
  CallerIdentity origin_caller = 16;
  string operation_id = 17;
  string parent_operation_id = 18;
  string trace_id = 19;
}

// CallerIdentity mirrors the versioned csar-core/caller contract for audit
// transport. Presence and structural validity do not establish authenticity.
message CallerIdentity {
  uint32 version = 1;
  string caller_kind = 2;
  string caller_id = 3;
  string owner_subject = 4;
  string effective_subject = 5;
  string credential_kind = 6;
  string credential_id = 7;
  string client_id = 8;
  string connection_id = 9;
  string assurance = 10;
}

message RecordEventRequest {
  AuditEvent event = 1;
}

message RecordEventResponse {}

message RecordEventsRequest {
  repeated AuditEvent events = 1;
}

message RecordEventsResponse {
  int32 accepted = 1;
}
